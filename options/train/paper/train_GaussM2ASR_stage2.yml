# general settings
name: GaussM2ASR_stage2
model_type: GaussM2ASRModel
scale: 4
num_gpu: 1  # set num_gpu: 0 for cpu mode
manual_seed: 0

tile_size: 48
tile_overlap: 8
tile_process: False  ###Set it to True during training stage, so as to accelerate the validation speed
crop_size: 4
denominator: 8

default_step_size: 1.2
cuda_rendering: True
mode: 'scale_modify'

if_dmax: True
dmax_mode: 'fix'
dmax: 0.5

# dataset and data loader settings
datasets:
  train:
    name: BraTS_train
    type: ContinuousBicubicDownsampleDataset
    all_gt_list: ['datasets/BraTS/train/HR']
    filename_tmpl: '{}'
    io_backend:
      type: disk

    lr_size: 64
    gt_size: 256
    use_hflip: False
    use_rot: False
    sample_size: 0 #48*48, set to 0 for full GT image input
    scale_list: [1.0, 4.0]

    # data loader
    num_worker_per_gpu: 4
    batch_size_per_gpu: 1
    dataset_enlarge_ratio: 1
    prefetch_mode: ~

    round_mode: 'round'

  val:
    name: BraTS_val
    type: ContinuousBicubicDownsampleDataset
    all_gt_list: ['datasets/BraTS/test/HR']
    filename_tmpl: '{}'
    io_backend:
      type: disk

    lr_size: 64
    gt_size: 256
    use_hflip: False
    use_rot: False
    sample_size: 0 #48*48, set to 0 for full GT image input
    scale_list: [4.0, 4.0]

# network structures
network_g:
  type: GaussM2ASRNet
  num_in_ch: 1
  num_feat: 64
  num_block: 16
  res_scale: 1.0

  channel: 180
  num_heads: 6
  num_crossattn_blocks: 1
  num_crossattn_layers: 3
  num_selfattn_blocks: 5
  num_selfattn_layers: 5
  num_gs_seed: 64
  gs_up_factor: 1.0
  window_size: 8
  img_range: 1.0
  shuffle_scale1: 2
  shuffle_scale2: 2

network_fea2gs:
  type: AnatomyGuidedGaussianParametrizer
  channel: 180
  num_gs_seed: 64
  num_colors: 3
  gs_up_factor: 1.0
  window_size: 8

# path
path:
  pretrain_network_g: ~
  strict_load_g: True
  resume_state: ~
  param_key_g: params

path_fea2gs:
  # Set this to the Stage 1 AGGP checkpoint before Stage 2 training.
  pretrain_network_fea2gs: ~
  strict_load_fea2gs: True
  resume_state: ~
  param_key_fea2gs: params


# training settings
train:
  stage: stage2
  clip_grad_norm: False
  ema_decay: 0.999
  optim_g:
    type: Adam
    lr: !!float 2e-4
    weight_decay: 0
    betas: [0.9, 0.99]

  optim_fea2gs:
    type: Adam
    lr: !!float 2e-4
    weight_decay: 0
    betas: [ 0.9, 0.99 ]

  scheduler:
    type: MultiStepLR
    milestones: [250000, 400000, 450000, 475000]
    gamma: 0.5

  total_iter: 500000
  warmup_iter: 2000  # no warm up

  # losses
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean

# validation settings
val:
  val_freq: !!float 2000
  save_img: True

  metrics:
    psnr: # metric name, can be arbitrary
      type: calculate_psnr
      crop_border: 0
      test_y_channel: False
    ssim: # metric name
      type: calculate_ssim
      crop_border: 0
      test_y_channel: False
#    lpips:
#      type: calculate_lpips
#      crop_border: 4
#      better: lower
#    dists:
#      type: calculate_dists
#      crop_border: 4
#      better: lower

# logging settings
logger:
  print_freq: 500
  save_checkpoint_freq: !!float 2000
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500
